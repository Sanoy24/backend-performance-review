# Reference registry
#
# Maps detection signals to the reference files that should be loaded, and declares the
# support tier for each technology. This is the single source of truth for both reference
# routing and the support table published in README.md and docs/supported-technologies.md.
#
# Adding a technology = one new file under technology/ + one entry here.
# Neither SKILL.md nor the methodology changes.
#
# Entry schema
#   signal:    stable identifier, kebab-case
#   kind:      datastore | cache | broker | runtime | framework | infrastructure
#   category:  for datastores — relational | document | graph | key-value | wide-column |
#              search | time-series | vector | object-store
#   match:     substrings matched case-insensitively against dependency names, image
#              names, connection scheme prefixes, and config keys
#   load:      reference files, in load order. Category file always precedes technology file.
#   tier:      deep | conceptual | generic
#              deep       — dedicated technology reference exists
#              conceptual — category principles apply; no engine-specific file yet
#              generic    — universal methodology only; graceful degradation applies
#   notes:     optional; surfaced in the report's scope section when tier != deep

version: 1

# ---------------------------------------------------------------------------
# Datastores — relational
# ---------------------------------------------------------------------------

- signal: postgres
  kind: datastore
  category: relational
  match: [psycopg, psycopg2, asyncpg, "pg8000", postgresql, postgres, "jackc/pgx", npgsql,
          "org.postgresql", "postgres://", "postgresql://", pg_dump, timescale, "lib/pq",
          "\"pg\":", "'pg'", "\"pg\""]
  load: [databases/universal.md, databases/relational.md, technology/postgres.md]
  tier: deep
  notes: >
    Two more driver gaps found by an audit of real dependency declarations per supported
    ecosystem (docs/evaluation.md, following on from #40): github.com/lib/pq, the other
    widely used Go Postgres driver alongside jackc/pgx, matched nothing; and node-postgres's
    package.json entry — just `"pg": "^8.11.0"`, the bare two-letter package name — is too
    short and common a substring to add unquoted (it would fire on "pgx", "pgadmin", or any
    word containing "pg"), so it is matched via the same quoted-literal technique already
    used for the node signal's `"node":` token: `"pg":` as it appears in a real
    package.json, not the bare substring. A separate audit found Knex names Postgres the
    same abbreviated way — `client: 'pg'` or `client: "pg"` in knexfile.js, never the full
    word — so the quoted-literal tokens `'pg'` and `"pg"` (quotes included) catch that too,
    now that detect_stack.py reads knexfile.js content, scoped the same way rather than a
    bare unquoted "pg" that would fire on "pgx"/"pgadmin" everywhere else scanned.

- signal: mysql
  kind: datastore
  category: relational
  match: [mysqlclient, pymysql, aiomysql, mysql2, "mysql-connector", "go-sql-driver/mysql",
          "mysql://", mariadb, "com.mysql", "pomelo.entityframeworkcore"]
  load: [databases/universal.md, databases/relational.md, technology/mysql.md]
  tier: deep
  notes: >
    Record the storage engine per table (a MyISAM table on a write-heavy path is a
    correctness-adjacent finding, not merely a performance one) and whether MySQL or MariaDB
    is actually deployed; technology/mysql.md covers InnoDB's clustered-index primary-key
    design, REPEATABLE READ gap locking, and buffer-pool sizing as the checkable specifics.

- signal: sqlserver
  kind: datastore
  category: relational
  match: [pyodbc, pymssql, "System.Data.SqlClient", "Microsoft.Data.SqlClient",
          "Microsoft.EntityFrameworkCore.SqlServer", mssql, "sqlserver://", tedious]
  load: [databases/universal.md, databases/relational.md, technology/sqlserver.md]
  tier: deep
  notes: >
    Behavioral evaluation (a .NET blind pass, docs/evaluation.md) found the match list
    covered only the raw ADO.NET client libraries and connection-string scheme, missing
    Microsoft.EntityFrameworkCore.SqlServer — the official EF Core provider package and the
    dominant way a .NET project declares a SQL Server dependency in its .csproj. A repo that
    references only this package, without also committing a packages.lock.json listing the
    transitive Microsoft.Data.SqlClient dependency, was invisible to this signal entirely.

- signal: oracle
  kind: datastore
  category: relational
  match: [cx_Oracle, oracledb, "ojdbc", "oracle.jdbc", godror, "Oracle.ManagedDataAccess",
          "jdbc:oracle:thin:@"]
  load: [databases/universal.md, databases/relational.md, technology/oracle.md]
  tier: deep

- signal: sqlite
  kind: datastore
  category: relational
  match: [sqlite3, "better-sqlite3", "mattn/go-sqlite3", "sqlite://", libsql,
          "sqlite-jdbc", "org.xerial", "jdbc:sqlite:", rusqlite,
          "Microsoft.EntityFrameworkCore.Sqlite", sqlite]
  load: [databases/universal.md, databases/relational.md, technology/sqlite.md]
  tier: deep
  notes: >
    Sequelize's CLI-scaffolded config.json spells its dialect field as the bare word
    "sqlite" — never "sqlite3" or any other already-covered token — so detecting it needs
    the bare word itself, same accepted trade-off already made for postgres/mysql/redis/
    kafka/cassandra's own bare-name tokens: real but occasional false-positive risk from an
    unrelated mention, softened by the weak_evidence grading for anything outside a real
    manifest.

- signal: cockroachdb
  kind: datastore
  category: relational
  match: [cockroach, "cockroachdb", cockroachlabs, crdb_internal]
  load: [databases/universal.md, databases/relational.md, technology/cockroachdb.md]
  tier: deep
  notes: >
    CockroachDB speaks the PostgreSQL wire protocol, so an application using it declares
    ordinary Postgres drivers (pgx, psycopg, pg, npgsql) and nothing in the dependency
    manifest names this engine — the postgres signal will fire instead. When both fire, or
    when postgres fires alone, confirm which engine is actually deployed before applying
    technology/postgres.md's engine-specific claims: vacuum, WAL, and buffer-cache reasoning
    do not transfer, and CockroachDB's application-visible transaction-retry requirement has
    no Postgres equivalent.

# ---------------------------------------------------------------------------
# Datastores — document
# ---------------------------------------------------------------------------

- signal: mongodb
  kind: datastore
  category: document
  match: [pymongo, motor, mongoose, mongodb, "mongo-go-driver", "mongodb://",
          "mongodb+srv://", mongoengine, beanie, "org.mongodb"]
  load: [databases/universal.md, databases/document.md, technology/mongodb.md]
  tier: deep

- signal: couchbase
  kind: datastore
  category: document
  match: [couchbase, "couchbase://", "couchbases://", gocb, "com.couchbase",
          "CouchbaseNetClient"]
  load: [databases/universal.md, databases/document.md, technology/couchbase.md]
  tier: deep

- signal: firestore
  kind: datastore
  category: document
  match: [firestore, "google-cloud-firestore", "firebase-admin", "firestore.indexes.json"]
  load: [databases/universal.md, databases/document.md, technology/firestore.md]
  tier: deep
  notes: >
    Billing is per document read/write, so cost is often the binding constraint rather
    than latency. Treat cost as a first-class axis for this engine. Record whether the
    database is in Native mode or Datastore mode — they are the same service with
    materially different query semantics and limits.

- signal: dynamodb
  kind: datastore
  category: key-value
  match: [dynamodb, "aws-sdk/client-dynamodb", boto3_dynamodb, "aws-sdk-go-v2/service/dynamodb"]
  load: [databases/universal.md, databases/key-value.md, technology/dynamodb.md]
  tier: deep
  notes: >
    Record the capacity mode (Provisioned + auto-scaling vs On-Demand) and whether a GSI
    exists and its capacity relative to the base table; technology/dynamodb.md covers
    partition-key-driven hot partitions, Scan's per-item-examined cost model, and GSI
    throttling propagating back to the base table as the checkable specifics.

# ---------------------------------------------------------------------------
# Datastores — other categories (conceptual in v0.1.0)
# ---------------------------------------------------------------------------

- signal: neo4j
  kind: datastore
  category: graph
  match: [neo4j, "bolt://", "neo4j://", py2neo, "neo4j-driver", cypher, "Neo4j.Driver"]
  load: [databases/universal.md, databases/graph.md, technology/neo4j.md]
  tier: deep

- signal: neptune
  kind: datastore
  category: graph
  match: ["amazonaws.com/neptune", neptune, gremlin, sparql, "opencypher"]
  load: [databases/universal.md, databases/graph.md, technology/neptune.md]
  tier: deep
  notes: >
    The gremlin, sparql, and opencypher tokens name query languages, not this engine —
    JanusGraph, Blazegraph, Apache Jena, and Neptune Analytics speak them too. Treat a match
    on those alone as "a graph query language is in use" and confirm the engine from a
    *.neptune.amazonaws.com endpoint or an infrastructure declaration before applying
    technology/neptune.md's managed-service specifics.

- signal: cassandra
  kind: datastore
  category: wide-column
  match: [cassandra, scylla, "cassandra-driver", gocql, datastax]
  load: [databases/universal.md, databases/wide-column.md, technology/cassandra.md]
  tier: deep

- signal: elasticsearch
  kind: datastore
  category: search
  match: [elasticsearch, opensearch, "@elastic/elasticsearch", "elastic/go-elasticsearch", solr]
  load: [databases/universal.md, databases/search.md, technology/elasticsearch.md]
  tier: deep

- signal: clickhouse
  kind: datastore
  category: wide-column
  match: [clickhouse, "clickhouse-driver", "clickhouse-connect"]
  load: [databases/universal.md, databases/wide-column.md, technology/clickhouse.md]
  tier: deep

- signal: influxdb
  kind: datastore
  category: time-series
  match: [influxdb, "influxdb-client", prometheus_remote_write, influxd, "org.influxdb",
          "com.influxdb"]
  load: [databases/universal.md, databases/time-series.md, technology/influxdb.md]
  tier: deep
  notes: >
    Establish the major version before scoring any finding: 1.x (InfluxQL/TSM), 2.x
    (Flux/buckets), and 3.x (SQL, columnar Parquet storage) differ enough that guidance for
    one can be actively wrong for another — the series-cardinality wall that dominates
    1.x/2.x reasoning is substantially removed in 3.x. If the version cannot be determined,
    say so in the report's scope section.

- signal: vector-store
  kind: datastore
  category: vector
  match: [pinecone, weaviate, qdrant, milvus, chromadb, pgvector, faiss, lancedb,
          "EXTENSION vector", "EXISTS vector", "@lancedb/lancedb"]
  load: [databases/universal.md, databases/vector.md, technology/vector-stores.md]
  tier: deep
  notes: >
    One combined signal spanning eight independently designed engines — a deliberately
    comparative technology file, not a per-vendor split (see docs/roadmap.md). Confirm which
    engine(s) are actually in use before applying a claim from the comparison table;
    pgvector in particular loads databases/relational.md's reasoning too when the connection
    is via a postgres signal, since it is a Postgres extension, not a standalone service.

- signal: object-storage
  kind: datastore
  category: object-store
  match: ["s3://", "aws-sdk/client-s3", boto3_s3, "amazonaws.com/s3", "com.amazonaws.services.s3",
          "google-cloud-storage", "storage.googleapis.com", "azure-storage-blob",
          "blob.core.windows.net", minio, "gcs://", "aws-sdk-go/service/s3",
          "aws-sdk-go-v2/service/s3", "software.amazon.awssdk:s3",
          "cloud.google.com/go/storage", "Google.Cloud.Storage", "@google-cloud/storage",
          "azure-sdk-for-go/sdk/storage/azblob", "Azure.Storage.Blobs",
          "@azure/storage-blob"]
  load: [databases/universal.md, databases/object-storage.md, technology/object-storage.md]
  tier: deep
  notes: >
    One combined signal spanning independently designed services (S3-compatible, GCS, Azure
    Blob) — a deliberately comparative technology file, not a per-vendor split (see
    docs/roadmap.md). Confirm which provider is actually in use before applying a claim from
    the comparison table. The AWS SDK v2 Java/Kotlin client (software.amazon.awssdk:s3) only
    matches when declared in single-line Gradle notation; a Maven pom.xml splits groupId and
    artifactId across separate elements with no reliably matchable contiguous substring, a
    known residual detection gap.

