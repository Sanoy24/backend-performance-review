- signal: redis
  kind: cache
  match: [redis, ioredis, "go-redis", redis_py, aioredis, redisson, "redis://", "rediss://",
          valkey, elasticache, "io.lettuce"]
  load: [databases/universal.md, databases/key-value.md, distributed/caching.md,
         technology/redis.md]
  tier: deep

- signal: memcached
  kind: cache
  match: [memcached, pymemcache, "gomemcache", memjs, pylibmc]
  load: [databases/universal.md, databases/key-value.md, distributed/caching.md,
         technology/memcached.md]
  tier: deep

# ---------------------------------------------------------------------------
# Message brokers and queues
# ---------------------------------------------------------------------------

- signal: kafka
  kind: broker
  match: [kafka, confluent_kafka, kafkajs, "segmentio/kafka-go", "sarama", redpanda]
  load: [distributed/retries-and-backpressure.md, distributed/timeouts-and-deadlines.md,
         technology/kafka.md]
  tier: deep
  notes: >
    Determine whether the deployment runs KRaft mode or ZooKeeper, and which consumer-group
    rebalancing protocol (eager vs cooperative sticky) is configured; technology/kafka.md
    covers rebalance blast radius, max.poll.interval.ms eviction, acks durability trade-offs,
    and retention-vs-compaction as the checkable specifics.

- signal: rabbitmq
  kind: broker
  match: [rabbitmq, pika, amqplib, "amqp://", "streadway/amqp", kombu, lapin,
          "starter-amqp"]
  load: [distributed/retries-and-backpressure.md, distributed/timeouts-and-deadlines.md,
         technology/rabbitmq.md]
  tier: deep
  notes: >
    Record the queue type (classic, quorum, or stream) and whether classic mirroring is
    still configured (deprecated, removed in 4.0); technology/rabbitmq.md covers the
    cluster-wide memory-alarm blast radius, prefetch/QoS, and exchange routing cost as the
    checkable specifics.

- signal: sqs
  kind: broker
  match: ["aws-sdk/client-sqs", "aws-sdk-go-v2/service/sqs", "arn:aws:sqs", "AWS::SQS"]
  load: [distributed/retries-and-backpressure.md, distributed/timeouts-and-deadlines.md]
  tier: generic

- signal: task-queue
  kind: broker
  match: [celery, sidekiq, bullmq, bull, "django-rq", "python-rq", dramatiq, "hangfire",
          temporal, "asynq"]
  load: [distributed/retries-and-backpressure.md, application/connection-pools.md]
  tier: generic
  notes: >
    A bare "rq" token was removed from this match list after behavioral evaluation found
    it matching inside base64-encoded hashes in lockfiles (e.g. go.sum), producing false
    positives. See docs/evaluation.md. This narrows detection of the Python `rq` library
    to its more specific package names; a project using bare `rq` without django-rq or
    python-rq framing will not be detected by this signal.

# ---------------------------------------------------------------------------
# Runtimes
# ---------------------------------------------------------------------------

- signal: node
  kind: runtime
  match: ["package.json", "node_modules", nodejs, "\"node\":"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/node.md]
  tier: deep
  notes: >
    "package.json" and "node_modules" alone cannot distinguish a Node.js backend from
    front-end tooling in a full-stack repository; behavioral evaluation fired this signal
    on a Python-backend repo that happened to contain a frontend, so verify the actual
    backend entry point before applying Node-specific reasoning (see docs/evaluation.md).

- signal: python
  kind: runtime
  match: ["requirements.txt", "pyproject.toml", "Pipfile", "setup.py"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/python.md]
  tier: deep
  notes: >
    Determine the concurrency model first — WSGI threads/processes vs ASGI event loop —
    because the failure modes differ completely; technology/python.md covers this and the
    GIL's role as the concrete mechanism behind this runtime's parallelism dimension.

- signal: jvm
  kind: runtime
  match: ["pom.xml", "build.gradle", "build.gradle.kts", ".java", ".kt"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/jvm.md]
  tier: deep
  notes: >
    Determine the concurrency model first — thread-per-request, reactive event-loop, or
    virtual threads (JDK 21+) — because severity of an identical blocking call differs
    completely between them; technology/jvm.md covers this plus GC-collector choice,
    JIT warm-up, and off-heap/metaspace memory as the concrete, checkable specifics.

- signal: go
  kind: runtime
  match: ["go.mod", "go.sum"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/go.md]
  tier: deep
  notes: >
    Identify the concurrency pattern actually used (unbounded goroutine spawning, a bounded
    worker pool, or a channel pipeline) before scoring anything; technology/go.md covers
    goroutine-leak detection, GOMAXPROCS-vs-container-CPU-quota mismatches, and the GC's
    budget-based (not algorithm-choice) tuning as the concrete, checkable specifics.

- signal: dotnet
  kind: runtime
  match: [".csproj", ".sln", ".fsproj"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/dotnet.md]
  tier: deep
  notes: >
    Determine first whether the code awaits asynchronously throughout or blocks synchronously
    on async work (.Result/.Wait()/.GetAwaiter().GetResult()) on a hot path; technology/dotnet.md
    covers thread-pool starvation as the concrete failure mode this produces, sync-over-async
    deadlock risk, value-type boxing, and Server-vs-Workstation GC as the checkable specifics.

- signal: rust
  kind: runtime
  match: ["Cargo.toml", "Cargo.lock"]
  load: [runtimes/universal.md, application/async-and-blocking.md, technology/rust.md]
  tier: deep
  notes: >
    Identify the async runtime actually in use (Tokio, async-std, smol, or none) before
    applying any async-specific reasoning, and confirm a --release build before drawing any
    conclusion from a profile or benchmark; technology/rust.md covers Rc/Arc reference-cycle
    leaks, spawn_blocking as the fix for a stalled async worker, and static-vs-dynamic
    dispatch as the checkable specifics.

- signal: php
  kind: runtime
  match: ["composer.json", "composer.lock", "artisan"]
  load: [runtimes/universal.md, technology/php.md]
  tier: deep

- signal: ruby
  kind: runtime
  match: ["Gemfile", "Gemfile.lock", "config.ru"]
  load: [runtimes/universal.md, technology/ruby.md]
  tier: deep

# ---------------------------------------------------------------------------
# API surfaces
# ---------------------------------------------------------------------------

- signal: graphql
  kind: framework
  match: [graphql, apollo, strawberry, graphene, gqlgen, "graphql-java", nexus]
  load: [application/api.md, application/data-access.md]
  tier: conceptual
  notes: >
    Resolver-level N+1 and unbounded query depth are the dominant GraphQL performance
    risks. Covered generically in application/api.md.

- signal: grpc
  kind: framework
  match: [grpc, "grpc-go", grpcio, "@grpc/grpc-js", protobuf]
  load: [application/api.md, application/serialization.md,
         distributed/timeouts-and-deadlines.md]
  tier: conceptual

- signal: rest
  kind: framework
  match: [fastapi, flask, django, express, nestjs, "\"koa\":", "gin-gonic/gin",
          "labstack/echo", "gofiber/fiber", "spring-boot", actix, axum, laravel, rails,
          "aspnetcore"]
  load: [application/api.md]
  tier: conceptual
  notes: >
    Go framework tokens use their full module path ("gin-gonic/gin", "labstack/echo",
    "gofiber/fiber") rather than the bare framework name. Behavioral evaluation found bare
    "gin" matching inside the word "logging" and bare "echo" matching inside ordinary shell
    `echo` commands in CI YAML — both are extremely common substrings outside their
    framework meaning. See docs/evaluation.md.

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------

- signal: kubernetes
  kind: infrastructure
  match: ["kind: Deployment", "kind: StatefulSet", "apiVersion: apps/v1", helm, "Chart.yaml"]
  load: [infrastructure/resources.md]
  tier: conceptual

- signal: docker
  kind: infrastructure
  match: [Dockerfile, "docker-compose.yml", "compose.yaml"]
  load: [infrastructure/resources.md]
  tier: conceptual

- signal: serverless
  kind: infrastructure
  match: ["serverless.yml", "template.yaml", "AWS::Serverless", lambda_handler,
          "func.HttpTrigger", "cloud-functions", vercel, "netlify.toml"]
  load: [infrastructure/resources.md, application/connection-pools.md]
  tier: conceptual
  notes: >
    Cold starts, per-invocation connection setup, and concurrency limits dominate.
    Connection pooling advice inverts under serverless — see infrastructure/resources.md.

- signal: terraform
  kind: infrastructure
  match: [".tf", "terraform"]
  load: [infrastructure/resources.md]
  tier: conceptual
