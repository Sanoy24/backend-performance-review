name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Cut a GitHub release from CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository invariants at the tagged commit
        run: |
          python3 scripts/check_repo_invariants.py

      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Pull the body between this version's '## [X.Y.Z]' heading and the next
          # '## [' heading (or end of file), so the release notes are exactly what
          # CHANGELOG.md already says — never hand-authored twice.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version (tag $tag)."
            echo "::error::Expected a '## [$version]' heading before tagging."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
