name: checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify structural invariants
        run: python scripts/check_repo_invariants.py

      - name: Verify the bundled detection script runs stdlib-only
        run: python skills/backend-performance-review/scripts/detect_stack.py . --pretty > /dev/null

      - name: Verify every relative Markdown link resolves
        run: python scripts/check_links.py

  stdlib-only:
    name: detect_stack.py, stdlib-only, no packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # No pip install step exists in this job, so the environment already has nothing
      # beyond the standard library. -I additionally ignores user site-packages and
      # PYTHONPATH, so a runner-local leak can't mask a real dependency by accident.
      - name: Run with an isolated interpreter as an extra guard
        shell: bash
        run: |
          python -I skills/backend-performance-review/scripts/detect_stack.py . --pretty > /dev/null

  detection-regressions:
    name: Detection regression fixtures (docs/evaluation.md §4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Covers the detection false-positive/false-negative corpus, the secret-safety and
      # hostile-repository fixtures, and the benchmark scoring harness. No pip install step
      # exists here either: every script under test is standard-library only.
      - name: Run the fixture corpus and the scoring harness tests
        run: python -m unittest discover -s tests -v

      - name: Verify the scoring harness runs on the committed example review
        run: |
          python benchmark/scoring/score.py score \
            --truth tests/fixtures/example-ground-truth.json \
            --review docs/examples/review.example.json \
            --json > /dev/null

      # The publishing path runs on every pull request once the action is in use, so a
      # break here is seen by users before it is seen by us.
      - name: Verify the publishing path end to end
        run: |
          python scripts/validate_review.py --review docs/examples/review.example.json
          python scripts/to_sarif.py --review docs/examples/review.example.json \
            --strict-verdict > /tmp/review.sarif
          python -c "import json; d=json.load(open('/tmp/review.sarif')); assert d['version']=='2.1.0'; assert d['runs']"
          python scripts/pr_comment.py --review docs/examples/review.example.json > /dev/null

  action-self-test:
    name: action.yml runs as an actual composite action (docs/roadmap.md — live Action dry run)
    runs-on: ubuntu-latest
    # This is the gap the first real validation run named explicitly: every script action.yml
    # calls is exercised above, but the composite action file itself — its step sequencing,
    # its `with:`/`env:` wiring, whether GitHub actually resolves `uses: ./` correctly — had
    # never executed on a real runner. `comment` and `upload-sarif` stay off here on purpose:
    # this job runs on every push and PR, and posting a real comment or a real code-scanning
    # upload on every one of those would be noise, not a test. It still exercises every other
    # step, including schema validation, SARIF generation, and verdict derivation, against the
    # actual action.yml file rather than only its constituent scripts run directly.
    #
    # TEMPORARY, for one push only: comment/upload-sarif flipped to "true" and permissions
    # widened, to prove the outward-facing half (docs/roadmap.md's remaining open item) against
    # this repository's own PR #54 — a real posted comment, a real code-scanning upload. The
    # next commit reverts both the flags and this permissions block back to the silent default.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run this repository's own action against its own example review
        id: self_test
        uses: ./
        with:
          review: docs/examples/review.example.json
          comment: "true"
          upload-sarif: "true"
          fail-on: never

      - name: Confirm the action's own outputs are wired correctly
        run: |
          test -f "${{ steps.self_test.outputs.sarif-file }}"
          python -c "
          import json
          d = json.load(open('${{ steps.self_test.outputs.sarif-file }}'))
          assert d['version'] == '2.1.0', 'action.yml produced non-SARIF-2.1.0 output'
          assert d['runs'], 'action.yml produced a SARIF file with no runs'
          "
          echo "action.yml outputs: verdict='${{ steps.self_test.outputs.verdict }}' findings='${{ steps.self_test.outputs.findings }}'"
          test "${{ steps.self_test.outputs.findings }}" = "1"
