name: checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify structural invariants
        run: python scripts/check_repo_invariants.py

      - name: Verify the bundled detection script runs stdlib-only
        run: python skills/backend-performance-review/scripts/detect_stack.py . --pretty > /dev/null

      - name: Verify every relative Markdown link resolves
        run: python scripts/check_links.py

  stdlib-only:
    name: detect_stack.py, stdlib-only, no packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # No pip install step exists in this job, so the environment already has nothing
      # beyond the standard library. -I additionally ignores user site-packages and
      # PYTHONPATH, so a runner-local leak can't mask a real dependency by accident.
      - name: Run with an isolated interpreter as an extra guard
        shell: bash
        run: |
          python -I skills/backend-performance-review/scripts/detect_stack.py . --pretty > /dev/null

      - name: Run the installation doctor at the minimum supported Python version
        shell: bash
        run: python -I scripts/doctor.py --project . --output .

  detection-regressions:
    name: Detection regression fixtures (docs/evaluation.md §4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Covers the detection false-positive/false-negative corpus, the secret-safety and
      # hostile-repository fixtures, and the benchmark scoring harness. No pip install step
      # exists here either: every script under test is standard-library only.
      - name: Run the fixture corpus and the scoring harness tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test maintained workflow recipes without model calls
        run: python -m unittest discover -s tests -p test_workflow_recipes.py -v

      - name: Verify the scoring harness runs on the committed example review
        run: |
          python benchmark/scoring/score.py score \
            --truth tests/fixtures/example-ground-truth.json \
            --review docs/examples/review.example.json \
            --json > /dev/null

      # The publishing path runs on every pull request once the action is in use, so a
      # break here is seen by users before it is seen by us.
      - name: Verify the publishing path end to end
        run: |
          python scripts/validate_review.py --review docs/examples/review.example.json
          python scripts/to_sarif.py --review docs/examples/review.example.json \
            --strict-verdict > /tmp/review.sarif
          python -c "import json; d=json.load(open('/tmp/review.sarif')); assert d['version']=='2.1.0'; assert d['runs']"
          python scripts/pr_comment.py --review docs/examples/review.example.json > /dev/null

  action-self-test:
    name: action.yml configuration and verdict matrix
    runs-on: ubuntu-latest
    # This is the gap the first real validation run named explicitly: every script action.yml
    # calls is exercised above, but the composite action file itself — its step sequencing,
    # its `with:`/`env:` wiring, whether GitHub actually resolves `uses: ./` correctly — had
    # never executed on a real runner. `comment` and `upload-sarif` stay off here on purpose:
    # this job runs on every push and PR, and posting a real comment or a real code-scanning
    # upload on every one of those would be noise, not a test. It still exercises every other
    # step, including schema validation, SARIF generation, and verdict derivation, against the
    # actual action.yml file rather than only its constituent scripts run directly.
    steps:
      - uses: actions/checkout@v4

      - name: Build valid full, FAIL, WARN, and UNKNOWN review fixtures
        run: python tests/fixtures/build_action_reviews.py "$RUNNER_TEMP/action-reviews"

      - name: Full review with advisory configuration succeeds
        id: self_test
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/full.json
          sarif-file: ${{ runner.temp }}/full.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: never

      - name: Confirm the action's own outputs are wired correctly
        run: |
          test -f "${{ runner.temp }}/full.sarif"
          python -c "
          import json
          d = json.load(open('${{ runner.temp }}/full.sarif'))
          assert d['version'] == '2.1.0', 'action.yml produced non-SARIF-2.1.0 output'
          assert d['runs'], 'action.yml produced a SARIF file with no runs'
          assert d['runs'][0]['properties']['verdict'] is None
          "
          test "${{ steps.self_test.outputs.verdict }}" = ""
          test "${{ steps.self_test.outputs.findings }}" = "1"

      - name: FAIL remains advisory under fail-on=never
        id: never_fail
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/fail.json
          sarif-file: ${{ runner.temp }}/never-fail.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: never

      - name: Confirm advisory FAIL outputs, SARIF, and comment agree
        run: |
          test "${{ steps.never_fail.outputs.verdict }}" = "FAIL"
          python -c "import json; assert json.load(open('${{ runner.temp }}/never-fail.sarif'))['runs'][0]['properties']['verdict'] == 'FAIL'"
          grep -F "Advisory. This check does not block merges." "$RUNNER_TEMP/perf-comment.md"

      - name: FAIL is rejected under fail-on=fail
        id: fail_fail
        continue-on-error: true
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/fail.json
          sarif-file: ${{ runner.temp }}/fail-fail.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: fail

      - name: Confirm fail-on=fail rejected FAIL
        run: test "${{ steps.fail_fail.outcome }}" = "failure"

      - name: WARN succeeds under fail-on=fail
        id: fail_warn
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/warn.json
          sarif-file: ${{ runner.temp }}/fail-warn.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: fail

      - name: Confirm WARN output and fail-only footer agree
        run: |
          test "${{ steps.fail_warn.outputs.verdict }}" = "WARN"
          grep -F "Merge gate: FAIL blocks" "$RUNNER_TEMP/perf-comment.md"

      - name: WARN is rejected under fail-on=warn
        id: warn_warn
        continue-on-error: true
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/warn.json
          sarif-file: ${{ runner.temp }}/warn-warn.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: warn

      - name: Confirm fail-on=warn rejected WARN
        run: test "${{ steps.warn_warn.outcome }}" = "failure"

      - name: UNKNOWN never blocks under fail-on=warn
        id: warn_unknown
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/unknown.json
          sarif-file: ${{ runner.temp }}/warn-unknown.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: warn

      - name: Confirm UNKNOWN output, SARIF, and comment agree
        run: |
          test "${{ steps.warn_unknown.outputs.verdict }}" = "UNKNOWN"
          python -c "import json; assert json.load(open('${{ runner.temp }}/warn-unknown.sarif'))['runs'][0]['properties']['verdict'] == 'UNKNOWN'"
          grep -F "PASS and UNKNOWN do not" "$RUNNER_TEMP/perf-comment.md"

      - name: Full mode never blocks under fail-on=warn
        id: warn_full
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/full.json
          sarif-file: ${{ runner.temp }}/warn-full.sarif
          comment: "false"
          upload-sarif: "false"
          fail-on: warn

      - name: Confirm full-mode output and footer agree
        run: |
          test "${{ steps.warn_full.outputs.verdict }}" = ""
          grep -F "configured warn gate does not apply" "$RUNNER_TEMP/perf-comment.md"

      - name: Invalid fail-on is rejected
        id: invalid_fail_on
        continue-on-error: true
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/full.json
          comment: "false"
          upload-sarif: "false"
          fail-on: warning

      - name: Confirm invalid fail-on failed closed
        run: test "${{ steps.invalid_fail_on.outcome }}" = "failure"

      - name: Invalid boolean-like input is rejected
        id: invalid_boolean
        continue-on-error: true
        uses: ./
        with:
          review: ${{ runner.temp }}/action-reviews/full.json
          comment: truthy
          upload-sarif: "false"
          fail-on: never

      - name: Confirm invalid boolean-like input failed closed
        run: test "${{ steps.invalid_boolean.outcome }}" = "failure"
